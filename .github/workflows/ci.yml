name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Smoke-test the CLI on the bundled fixture
        run: |
          tokenlens analyze tests/fixtures/sample-session.jsonl
          tokenlens analyze tests/fixtures/sample-session.jsonl --json --no-turns > /dev/null
          tokenlens models
        shell: bash
