[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenlens"
version = "0.1.0"
description = "Analyze Claude Code session transcripts: accurate cost, context growth, waste detection, and what-if model comparisons."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vinayak Mokashi", email = "vinayakmokashi305@gmail.com" }]
keywords = ["claude", "claude-code", "tokens", "cost", "usage", "analyzer", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
web = ["flask>=3.0"]
dev = ["pytest>=7", "flask>=3.0"]

[project.scripts]
tokenlens = "tokenlens.cli:main"

[project.urls]
Homepage = "https://github.com/VinayakMokashi/tokenlens"
Issues = "https://github.com/VinayakMokashi/tokenlens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tokenlens.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
